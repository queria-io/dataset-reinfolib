schema: main
name: mart_appraisal_reports
title: 鑑定評価書情報
description: 国土交通省 不動産情報ライブラリの鑑定評価書情報。地価公示の標準地ごとに不動産鑑定士が作成した鑑定評価書の内容を1通1行で収録する。評価額のほか、取引事例比較法・収益還元法・原価法・開発法の適用結果と算定内訳、比準に用いた取引事例5件の価格、標準地の形状・接面道路・法令規制を持つ。1つの標準地につき2通の鑑定評価書があり、評価額は評価書ごとに異なる。
published: true
sources:
  - path: https://www.reinfolib.mlit.go.jp/
fields:
  - name: year
    title: 価格時点年
  - name: prefecture_code
    title: 都道府県コード
  - name: city_code
    title: 市区町村コード
    description: 5桁。lg_code や address_br と結合できる
  - name: use_division_code
    title: 用途区分コード
    description: 00=住宅地、03=宅地見込地、05=商業地、07=準工業地、09=工業地、10=調整区域内宅地、13=現況林地、20=林地（都道府県地価調査）
  - name: standard_lot_number
    title: 標準地番号
    description: mart_land_prices の standard_lot_number と同じ表記。一意なのは都道府県の中だけ

version: 2

models:
  - name: mart_appraisal_reports
    description: 国土交通省 不動産情報ライブラリの鑑定評価書情報。地価公示の標準地ごとに不動産鑑定士が作成した鑑定評価書の内容を1通1行で収録する。評価額のほか、取引事例比較法・収益還元法・原価法・開発法の適用結果と算定内訳、比準に用いた取引事例5件の価格、標準地の形状・接面道路・法令規制を持つ。1つの標準地につき2通の鑑定評価書があり、評価額は評価書ごとに異なる。

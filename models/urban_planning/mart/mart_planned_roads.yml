version: 2

models:
  - name: mart_planned_roads
    description: 国土交通省 不動産情報ライブラリの都市計画決定GISデータ（令和7年度）に基づく、都市計画道路の線と都市計画で定めた広場の範囲。原典は路線名を持たないので、1行は市区町村・種類・告示の組で、同じ告示の道路は 1 つの線にまとめて入る。東京都の特別区のように、都市計画道路があっても原典に無い市区町村がある。原典は区域をタイルの境界で切って配信するため、属性が同じ断片を 1 つのポリゴンに結合して収録している。設定年月日と告示番号は原典が和暦・西暦・略記の混在した文字列で公開しているため、そのままの形で入っている。地方公共団体が GIS データを保有していない・公表できないなどの理由で、都市計画決定があっても収録されていない区域がある。範囲は概ねの位置で、建築確認申請や重要事項説明の根拠には使えない。
    columns:
      - name: prefecture_code
      - name: prefecture_name
      - name: city_code
      - name: city_name
      - name: kubun_id
      - name: road_type
      - name: decision_classification
      - name: decision_date
      - name: decision_maker
      - name: notice_number
      - name: first_notice_number
      - name: first_decision_date
      - name: geom

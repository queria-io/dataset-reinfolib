schema: urban_planning
name: mart_location_optimization_plans
title: 立地適正化計画
description: 国土交通省 不動産情報ライブラリの都市計画決定GISデータ（令和7年度）に基づく、立地適正化計画の区域のポリゴン。立地適正化計画区域・居住誘導区域・都市機能誘導区域などを区域の種類ごとに持つ。原典は区域をタイルの境界で切って配信するため、属性が同じ断片を 1 つのポリゴンに結合して収録している。設定年月日と告示番号は原典が和暦・西暦・略記の混在した文字列で公開しているため、そのままの形で入っている。地方公共団体が GIS データを保有していない・公表できないなどの理由で、都市計画決定があっても収録されていない区域がある。範囲は概ねの位置で、建築確認申請や重要事項説明の根拠には使えない。
published: true
sources:
  - path: https://www.reinfolib.mlit.go.jp/
fields:
  - name: prefecture_code
    title: 都道府県コード
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
  - name: city_code
    title: 市区町村コード
    semantic: { role: entity, name: city }
  - name: city_name
    title: 市区町村名
  - name: kubun_id
    title: 区域コード
    description: 0=立地適正化計画区域、31=居住誘導区域、32=都市機能誘導区域
  - name: zone_name
    title: 区域名
  - name: area_classification
    title: 区域区分
  - name: decision_date
    title: 設定年月日
    description: 最終告示日。原典が和暦・西暦・略記の混在した文字列で公開しているため、そのまま収録している
  - name: decision_classification
    title: 設定区分
  - name: decision_maker
    title: 設定者名
  - name: notice_number
    title: 告示番号
    description: 最終告示の番号
  - name: first_notice_number
    title: 当初告示番号
  - name: first_decision_date
    title: 当初決定日
  - name: geom
    title: ポリゴン
    description: EPSG:6668。タイルで切られて配信される断片を、属性が同じものごとに結合したもの

schema: urban_planning
name: mart_use_districts
title: 用途地域
description: |-
  用途地域のポリゴンを、用途地域の種類（13 種類）と指定された容積率・建蔽率とともに持つテーブルです。令和7年度の都市計画決定GISデータです。

  - 範囲は概ねの位置で、重要事項説明や建築確認申請の根拠には使えません
  - 地方公共団体が GIS データを出していない区域は含みません
  - 設定年月日と告示番号は原典の文字列のままです（和暦・西暦・略記が混在）
published: true
sources:
  - path: https://www.reinfolib.mlit.go.jp/
fields:
  - name: prefecture_code
    title: 都道府県コード
    semantic: { role: entity, name: prefecture }
  - name: prefecture_name
    title: 都道府県名
  - name: city_code
    title: 市区町村コード
    semantic: { role: entity, name: city }
  - name: city_name
    title: 市区町村名
  - name: use_district_code
    title: 用途地域分類コード
    description: 原典のコード（1=第１種低層住居専用地域、10=商業地域、11=準工業地域など）。use_district と 1 対 1 に対応する
  - name: use_district
    title: 用途地域名
  - name: decision_date
    title: 設定年月日
    description: 最終告示日。原典が和暦・西暦・略記の混在した文字列で公開しているため、そのまま収録している
  - name: decision_classification
    title: 設定区分
  - name: decision_maker
    title: 設定者名
  - name: notice_number
    title: 告示番号
    description: 最終告示の番号
  - name: first_notice_number
    title: 当初告示番号
  - name: first_decision_date
    title: 当初決定日
  - name: floor_area_ratio
    title: 容積率
    description: 単位は %。原典の「300.0%」のような文字列から数値にしたもの。数値にならない値は NULL
  - name: building_coverage_ratio
    title: 建蔽率
    description: 単位は %。容積率と同じく原典の文字列から数値にしたもの
  - name: geom
    title: ポリゴン
    description: EPSG:6668。タイルで切られて配信される断片を、属性が同じものごとに結合したもの

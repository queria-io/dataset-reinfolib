schema: regulation
name: mart_special_watch_areas
title: 特別注視区域
description: 国土交通省 不動産情報ライブラリが配信する、重要土地等調査法に基づく特別注視区域のポリゴン。内閣府が指定した区域で、区域内の一定面積以上の土地・建物の売買などの契約は、売主と買主の双方が内閣総理大臣に事前に届け出る必要がある。1行が1つの区域名で、原典がタイルの境界で切って配信する断片を区域名ごとに結合している。区域の範囲は概ねの位置で、正式な範囲は内閣府の公示で確認する。
published: true
sources:
  - path: https://www.reinfolib.mlit.go.jp/
  - path: https://www.cao.go.jp/tochi-chosa/kuiki.html
fields:

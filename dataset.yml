spec_version: "0.1"
name: reinfolib
title: 不動産情報ライブラリ
description: |-
  国土交通省の不動産情報ライブラリの API から取得した、全国の不動産取引価格・地価公示・地価調査・鑑定評価書、都市計画決定GISデータ、防災情報、重要土地等調査法の特別注視区域です。地点と区域は座標と形状を持ちます。
  このサービスは、国土交通省の不動産情報ライブラリのAPI機能を使用していますが、提供情報の最新性、正確性、完全性等が保証されたものではありません。
keywords:
  - 不動産
  - 価格
  - 取引
  - 地価
  - 鑑定評価
  - 都市計画
  - 用途地域
  - 液状化
  - 避難場所
  - 国土交通省
homepage: https://github.com/queria-io/dataset-reinfolib
language: ja
themes: [housing_land]

licenses:
  - JP-GOV-STD-2.0

sources:
  - title: 不動産情報ライブラリ（国土交通省）
    path: https://www.reinfolib.mlit.go.jp/

contributors:
  - title: 国土交通省
    path: https://www.mlit.go.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "1995", end: null }
spatial_coverage: [JP]
update_frequency: daily
cover: 🏠

ai_context:
  instructions: |
    地域ごとの不動産の相場や地価の推移、土地の規制や災害の傾向を調べるのに使う。価格と都市計画区域には性格の違う4つの表がある。
    mart_trade_prices は実際の取引（578万件・2005年〜）で、1行が1取引。
    mart_land_prices は地価公示・地価調査の標準地（141万件・1995年〜）で、1行が1地点1年。
    取引価格は個々の取引なので外れ値を含む。地域の相場を見るときは平均より中央値を使い、
    件数の少ない地区は避ける。面積や価格は元データの段階で丸めや上限（「2000㎡以上」など）が
    入っているため、そのまま平均すると歪む。
    取引時期は year と quarter（四半期）までで、日付までは公開されない。
    market_price を建物込みで比べるときは property_type（宅地・中古マンション等・農地・林地）を揃える。
    価格区分（price_category）に取引価格と成約価格が混在するので、比較するときは絞る。
    市区町村コード（municipality_code / city_code）で lg_code や address_br と結合できる。
    mart_appraisal_reports は地価公示の標準地ごとの鑑定評価書（2022年〜）で、1行が1通。
    価格そのものではなく「なぜその価格か」を持つ。取引事例比較法・収益還元法・原価法・
    開発法それぞれの適用結果と算定内訳、比準に用いた取引事例5件の価格が入る。
    適用していない手法は価格が0で入るので、平均を取るときは0を除く。
    1つの標準地に2通の鑑定評価書があり、評価額（appraised_price）は評価書ごとに異なる。
    公表される公示価格は2通のどちらとも一致しないことがある。appraised_price も
    published_price も鑑定評価書に書かれた値なので、公表値を見るときは mart_land_prices の
    current_price を使う。
    mart_land_prices と結合するときは year・prefecture_code・standard_lot_number の3つで
    突き合わせる。標準地番号が一意なのは都道府県の中だけで、mart_land_prices は同じ地点を
    年ごとに持つ。収録は地価公示だけなので、mart_land_prices 側は land_price_type = 0 に絞る。
    1地点に評価書が2通あるので結合は1対2になり、地点あたりの集計は先に評価書側を畳む。
    mart_urban_planning_areas は都市計画区域・市街化区域・市街化調整区域のポリゴンで、
    1行が市区町村と区域区分の組。ST_Contains で地点がどの区域に入るかを判定できる。
    地点の列（geom）を持つのは mart_land_prices と mart_appraisal_reports で、空間結合の
    相手はこちら。mart_trade_prices は地区名までしか位置を持たず、空間結合はできない。
    1行は市区町村単位に分かれているので、都道府県や全国の広さを見るときは合算する。
    urban_planning スキーマには、ほかに用途地域（mart_use_districts、容積率・建蔽率つき）・
    立地適正化計画・防火・準防火地域・地区計画・高度利用地区・都市計画道路がある。いずれも
    令和7年度の都市計画決定GISデータで、地方公共団体が GIS データを出していない区域は
    入っていない。区域が無い場所は「指定が無い」ではなく「収録していない」場合を含む。
    disaster スキーマは防災情報で、液状化の発生傾向（250m メッシュ）・土地履歴調査の災害履歴・
    指定緊急避難場所（災害の種類ごとの対応フラグつき）を持つ。洪水・土砂災害などの浸水想定や
    警戒区域は nlftp の hazard スキーマにある。
    regulation スキーマの mart_special_watch_areas は重要土地等調査法の特別注視区域。
    いずれのポリゴンも概ねの位置で、重要事項説明や建築確認申請の根拠には使えない。
    国土交通省 不動産情報ライブラリの API 機能を使用しているが、
    提供情報の最新性・正確性・完全性が保証されたものではない。
  synonyms: [不動産取引価格, 地価公示, 地価調査, 実勢価格, 鑑定評価書, 標準地, 用途地域, 容積率, 建蔽率, 液状化, 避難場所, 地区計画]
  examples:
    - 市区町村別の中古マンションの取引価格の中央値を年ごとに出したい
    - 地価公示の標準地の価格の推移が見たい
    - ある地区の土地取引の平米単価を調べたい
    - 市街化区域と市街化調整区域で地価公示の価格がどれだけ違うか比べたい
    - 商業地の地価が収益還元法と取引事例比較法でどれだけ違うか見たい
    - 同じ標準地を担当した2人の鑑定士の評価額の開きが大きい地点を探したい
    - 用途地域ごとに地価公示の価格を比べたい
    - ある地点の用途地域と容積率・建蔽率を調べたい
    - 液状化の発生傾向が強いメッシュにある地価公示の地点を数えたい
    - 地震に対応した指定緊急避難場所を市区町村ごとに数えたい

schemas:
  - name: main
    title: 不動産価格情報
  - name: urban_planning
    title: 都市計画決定GISデータ
  - name: disaster
    title: 防災情報
  - name: regulation
    title: 土地利用の規制
